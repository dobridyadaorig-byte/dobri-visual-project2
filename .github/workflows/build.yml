name: Build Dobri Visual

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
        if: ${{ hashFiles('gradlew') != '' }}

      - name: Build mod
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew build
          else
            echo "Gradle wrapper gradlew is missing"
            exit 1
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Dobri-Visual
          path: build/libs/*.jar
          if-no-files-found: error
